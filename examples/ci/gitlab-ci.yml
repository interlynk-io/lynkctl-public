stages: [sbom]
firmware-sbom:
  stage: sbom
  tags: [lynkctl]
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  script:
    - mkdir -p sbom-output
    - lynkctl version --json > sbom-output/generator.json 2>&1
    - export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
    - lynkctl generate . --provider gnu-make --strict --evidence --reproducible -o sbom-output/firmware.cdx.json 2> sbom-output/diagnostics.txt
  artifacts:
    when: always
    paths: [sbom-output/]
    expire_in: 30 days
