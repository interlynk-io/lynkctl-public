name: Validate documentation and CI examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          python3 -m venv /tmp/validation-env
          /tmp/validation-env/bin/pip install PyYAML==6.0.2
      - name: Check documentation links and YAML
        shell: bash
        run: |
          /tmp/validation-env/bin/python - <<'PYTHON'
          import re
          from pathlib import Path
          import yaml

          for path in Path('.').rglob('*.md'):
              for target in re.findall(r'\]\(([^)]+)\)', path.read_text()):
                  if not re.match(r'https?:|mailto:|#', target):
                      assert (path.parent / target.split('#')[0]).exists(), (path, target)
          for path in Path('.').rglob('*.yml'):
              assert isinstance(yaml.safe_load(path.read_text()), dict), path
          print('Validated local documentation links and YAML files')
          PYTHON
