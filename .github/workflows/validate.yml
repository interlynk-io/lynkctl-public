name: Validate public examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install validation tools
        run: |
          python3 -m venv /tmp/validation-env
          /tmp/validation-env/bin/pip install jsonschema==4.23.0 PyYAML==6.0.2
      - name: Fetch checksum-pinned official CycloneDX 1.6 schemas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cdx-schemas
          cd /tmp/cdx-schemas
          for schema in bom-1.6.schema.json spdx.schema.json jsf-0.82.schema.json; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/CycloneDX/specification/1.6/schema/$schema" -o "$schema"
          done
          sha256sum --check <<'CHECKSUMS'
          3e92dddbc30cf7f6a02b80f0942b1a4cfd4fb1c26f1dfc4310afa9d613cafb93  bom-1.6.schema.json
          baa9d3bd1ed57b6751b0887edead6b5063ff53ff7429cf85d476c6c94af0166e  spdx.schema.json
          8bae002c25e723db7ee1f26afde680ae1a2b1a8f6b4b4b0fd65dc3becb090aae  jsf-0.82.schema.json
          CHECKSUMS
      - name: Check schemas, provenance, links, and YAML
        shell: bash
        run: |
          /tmp/validation-env/bin/python - <<'PYTHON'
          import hashlib
          import json
          import re
          from pathlib import Path
          import jsonschema
          import yaml
          from referencing import Registry, Resource

          registry = Registry()
          schema_dir = Path('/tmp/cdx-schemas')
          for path in schema_dir.glob('*.json'):
              resource = Resource.from_contents(json.loads(path.read_text()))
              for protocol in ('http', 'https'):
                  registry = registry.with_resource(f'{protocol}://cyclonedx.org/schema/{path.name}', resource)
          validator = jsonschema.Draft7Validator(
              json.loads((schema_dir / 'bom-1.6.schema.json').read_text()), registry=registry)
          examples = list(Path('examples/sboms').glob('*.cdx.json'))
          assert len(examples) >= 2, 'Expected public firmware examples'
          for path in examples:
              validator.validate(json.loads(path.read_text()))
              provenance = json.loads(path.with_name(path.name.replace('.cdx.json', '.provenance.json')).read_text())
              assert hashlib.sha256(path.read_bytes()).hexdigest() == provenance['sbom_sha256'], path
              assert provenance['exit_code'] == 0, path
              assert path.with_name(path.name.replace('.cdx.json', '.diagnostics.txt')).is_file(), path
          for path in Path('.').rglob('*.md'):
              for target in re.findall(r'\]\(([^)]+)\)', path.read_text()):
                  if not re.match(r'https?:|mailto:|#', target):
                      assert (path.parent / target.split('#')[0]).exists(), (path, target)
          for path in Path('.').rglob('*.yml'):
              assert isinstance(yaml.safe_load(path.read_text()), dict), path
          print(f'Validated {len(examples)} SBOMs, provenance hashes, local links, and YAML files')
          PYTHON
